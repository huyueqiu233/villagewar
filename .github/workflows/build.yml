name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Collect jar
        run: |
          mkdir -p /tmp/dist
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -exec cp {} /tmp/dist/ \;
          ls -la /tmp/dist

      - name: Publish jar as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: /tmp/dist/*.jar

      # 单独推一个 dist 分支放 jar：本机访问 github.com 被加速器中间人拦截，
      # 但 git over SSH 是通的，这样下载产物不依赖 HTTPS。
      - name: Publish jar to dist branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dist
          git reset --hard
          git clean -fdx
          cp /tmp/dist/*.jar .
          git add -f *.jar
          git commit -m "build ${{ github.run_number }}"
          git push -f origin dist
